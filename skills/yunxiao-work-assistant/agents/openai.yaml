interface:
  display_name: "云效工作助手"
  short_description: "从云效生成周计划、周报，并可确认后写回计划或创建需求分支"
  default_prompt: "使用 $yunxiao-work-assistant 帮我读取云效待办，安排本周工作；需要写回计划日期、预计工时或创建需求分支时先给我确认清单。"

dependencies:
  tools:
    - type: "mcp"
      value: "yunxiao"
      description: "云效 MCP，用于查询项目、工作项、字段、预计工时、评论、代码仓库、分支和代码提交，并在确认后写回周计划或创建需求分支"
