interface:
  display_name: "云效 MR 审核助手"
  short_description: "结合项目指南和规格审核 MR，并写入问题与总结评论"
  default_prompt: "使用 $yunxiao-mr-reviewer 帮我审核这个云效 Codeup MR，读取项目指南和需求资料，发现明确问题时按固定模板写入代码评论，最后发布一条帮助审核人员理解改动的总结，包括代码阅读顺序、改动前后对照、关键流程、重点逻辑、检查清单和审核结论。"

dependencies:
  tools:
    - type: "mcp"
      value: "yunxiao"
      description: "云效 MCP，建议至少启用 code-management；需要按关联需求审核时同时启用 project-management"
